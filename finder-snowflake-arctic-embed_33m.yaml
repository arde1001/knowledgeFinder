# Finder thresholds for snowflake-arctic-embed:33m (the low profile's embedder), tuned like finder.yaml on the
# synthetic corpus: evals/bench_finder.py --lexical and --denial with KF_PROFILE=low (evals/profile_benchmark.md).
# Its cosine scores run about 0.07 lower than nomic-embed-text's, so the thresholds do too.
tuned_for: snowflake-arctic-embed:33m  # the embedding model these scores belong to (the finder checks the index)
lex_weight: 0.3        # BM25 keyword score (0-1, normalised) times this is added to the cosine similarity (0 = embeddings only)
max_sources: 5         # at most this many readable files per question (1-10)
ratio: 0.95            # drop a source scoring below ratio * the best readable score
min_score: 0.80        # no sources if the best readable score is below this (weakest real question tops out at 0.83; off-topic and invented-event questions stay below)
denial_mode: best      # a notice names the drive of the best file overall when that file is unreadable, ...
min_denial_score: 0.80 # ... it scores at least this, ...
margin: 0.04           # ... and its drive beats every file in other drives by this much (0.84 of answers' drives named, no noise)
# "cluster" mode (the previous rule) instead uses K and N: fire when at least N of the top K files sit in one unreadable drive.
K: 3
N: 2
